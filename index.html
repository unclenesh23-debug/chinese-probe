<main id="view" class="view"><div id="boot" class="boot">Загружаю…</div></main>
<audio id="aud" preload="auto" playsinline></audio>
<audio id="aud2" playsinline></audio>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><p style="padding:24px">Нужен JavaScript. Открой страницу в Safari.</p></noscript>
<script>
/* Запасной экран: если основной скрипт не запустился (обрыв связи, старый iPhone), покажем причину. */
window.__probeErr = [];
window.addEventListener("error", function (e) {
  try { window.__probeErr.push(String(e.message || e.type) + (e.filename ? " @" + String(e.filename).split("/").pop() + ":" + e.lineno : "")); } catch (x) {}
});
setTimeout(function () {
  if (window.__probeBoot) return;
  var b = document.getElementById("boot");
  if (!b) return;
  b.className = "boot bad";
  b.textContent = "Страница не запустилась. Скажи Claude: «" + (window.__probeErr[0] || "скрипт не загрузился") + "» и " + (navigator.userAgent || "").slice(0, 160);
}, 4000);
</script>
